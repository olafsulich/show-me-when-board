<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="build" content="__BUILD_SHA__" />
    <title>sched-prod · incidents</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header>
      <h1>incidents</h1>
      <p class="sub">sched-prod · tonight · <span class="status" data-role="status">connecting…</span></p>
    </header>
    <main data-testid="board">
      <div data-testid="loader" class="loader" role="status" aria-live="polite">Loading incidents…</div>
      <p data-testid="empty" class="empty" hidden>No incidents tonight.</p>
      <p class="error" data-role="error" role="alert" hidden></p>
      <ul data-testid="incident-list" class="list" hidden></ul>
    </main>
    <aside data-testid="incident-panel" class="panel" aria-labelledby="panel-title" hidden>
      <div class="panel-head">
        <h2 id="panel-title" data-role="panel-id"></h2>
        <button type="button" class="panel-close" data-role="panel-close" aria-label="Close panel">×</button>
      </div>
      <p class="panel-sev" data-role="panel-sev"></p>
      <dl class="panel-facts">
        <dt>Service</dt><dd data-role="panel-service"></dd>
        <dt>Region</dt><dd data-role="panel-region"></dd>
        <dt>Summary</dt><dd data-role="panel-summary"></dd>
        <dt>Opened</dt><dd><time data-role="panel-time"></time></dd>
      </dl>
      <div class="panel-act" data-role="panel-act"></div>
    </aside>
    <footer>sched-prod incident board · build <code data-testid="build-sha">__BUILD_SHA__</code></footer>
  </body>
</html>
